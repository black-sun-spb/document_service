version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: document_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery:
    build: .
    command: celery -A config worker -l info --pool=solo
    volumes:
      - .:/app
      - media:/app/media
    env_file:
      - .env
    depends_on:
      - redis
      - web
      - db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  media:
  pgdata:
